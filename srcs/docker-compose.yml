version: "3.8"

services:
  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb
  nginx:
    build: requirements/nginx/.
    container_name: nginx
    ports: 
      - "8080:80"
    depends_on:
      - wordpress
    volumes:
      - ./web:/var/www/html
  wordpress:
    build: requirements/wordpress/.
    container_name: wp-php
    volumes:
      - ./web:/var/www/html
    depends_on:
      - mariadb
